# slf4j-simple, which is this app's only logging binding (pom.xml: org.slf4j:slf4j-simple).
#
# Why it exists: opening a project resolves its classpath through Maven Resolver, and every javafx-*
# artifact's pom declares its platform-classifier dependencies in a shape the descriptor reader reports as
# six "problems" per pom. They are WARNs about somebody else's published poms, nothing here can fix them,
# and the resolution succeeds — so they were six lines of noise per module at every project open.
#
# Only the descriptor readers are silenced, and only to `error`: a resolution that actually fails still
# says so, at the level a failure is reported.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.apache.maven.repository.internal=error
org.slf4j.simpleLogger.log.org.eclipse.aether.internal.impl=error
org.slf4j.simpleLogger.log.org.eclipse.aether.internal.impl.DefaultArtifactResolver=error
