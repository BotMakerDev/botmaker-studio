<!DOCTYPE html>
<!--
  The Terminal tab's screen: xterm.js 5.5.0 + addon-fit 0.10.0, vendored (MIT, LICENSE-xterm.txt).
  Java (ui/app/terminal/TerminalView) sets window.java once the page has loaded, then calls bm.start.
  Output arrives base64 so no byte needs escaping into a script string; input leaves as the string xterm gives.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  /* The monospaced face Studio ships (BlockFont.MONO_FAMILY), from the jar beside this page. */
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../fonts/JetBrainsMono-Regular.ttf'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../fonts/JetBrainsMono-Bold.ttf'); }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  #screen { position: absolute; inset: 4px 0 0 6px; }
</style>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
</head>
<body>
<div id="screen"></div>
<script>
  var term = null;
  var fit = null;

  function decode(b64) {
    var raw = atob(b64);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function refit() {
    if (!fit) return;
    try { fit.fit(); } catch (e) { /* not laid out yet */ }
  }

  /* xterm measures a cell once, when it opens: open before the face has loaded and every cell is the fallback's width. */
  function whenFontReady(fontSize, then) {
    if (!document.fonts || !document.fonts.load) { then(); return; }
    Promise.all([
      document.fonts.load(fontSize + "px 'JetBrains Mono'"),
      document.fonts.load("bold " + fontSize + "px 'JetBrains Mono'")
    ]).then(then, then);
  }

  /* The program starts on the first size report below, so nothing it prints can arrive before the screen exists. */
  function openScreen(theme, fontFamily, fontSize) {
      term = new Terminal({
        theme: theme,
        fontFamily: fontFamily,
        fontSize: fontSize,
        cursorBlink: true,
        scrollback: 5000,
        allowProposedApi: false
      });
      fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('screen'));
      term.onData(function (data) { window.java.onData(data); });
      term.onBinary(function (data) { window.java.onBinary(data); });
      term.onResize(function (size) { window.java.onResize(size.cols, size.rows); });
      term.attachCustomKeyEventHandler(function (e) {
        if (e.type !== 'keydown' || !e.ctrlKey || !e.shiftKey) return true;
        if (e.code === 'KeyC') { window.java.copy(term.getSelection()); return false; }
        if (e.code === 'KeyV') { window.java.paste(); return false; }
        return true;
      });
      window.addEventListener('resize', refit);
      refit();
      window.java.onResize(term.cols, term.rows);
      term.focus();
  }

  var bm = {
    start: function (theme, fontFamily, fontSize) {
      whenFontReady(fontSize, function () { openScreen(theme, fontFamily, fontSize); });
    },
    write: function (b64) { if (term) term.write(decode(b64)); },
    paste: function (b64) { if (term) term.paste(new TextDecoder().decode(decode(b64))); },
    theme: function (theme) { if (term) term.options.theme = theme; },
    font: function (fontFamily, fontSize) {
      if (!term) return;
      term.options.fontFamily = fontFamily;
      term.options.fontSize = fontSize;
      refit();
    },
    fit: refit,
    focus: function () { if (term) term.focus(); },
    selection: function () { return term ? term.getSelection() : ''; }
  };
</script>
</body>
</html>
