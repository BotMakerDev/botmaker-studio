# The .bmk bot file (spec 2026-10-24 § 5), handed to jpackage as a file association by every installer: the
# deb and rpm (a shared-mime-info package plus the menu entry's MimeType), the msi (registry), the dmg app
# (CFBundleDocumentTypes). Filtered by the dist profile, so the icon is each system's own format.
extension=bmk
mime-type=application/x-botmaker-bot
description=BotMaker bot
icon=${installer.icon}
